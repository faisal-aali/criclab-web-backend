# Sync Python source onto the instance, then restart via PM2.
# The runner is registered to this repo only — `self-hosted` is enough.
# This is FastAPI, not Node — do not npm ci here.
#
# Do not use actions/setup-python here: that action has no 3.12 build for
# Debian 12. Bookworm ships Python 3.11 as `python3`, which MediaPipe accepts.
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lightsail-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check system Python (3.10–3.12)
        run: |
          whoami
          if ! command -v python3 >/dev/null; then
            echo "python3 is missing. On Debian 12 run:"
            echo "  sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-dev python3-pip"
            exit 1
          fi
          python3 --version
          python3 -c "import sys; v=sys.version_info[:2]; assert (3,10)<=v<=(3,12), 'need 3.10–3.12, got '+sys.version"

      - name: Sync source (never overwrites .env or the venv)
        run: |
          DEST=/var/www/criclab-web-backend
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.venv312/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'storage/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ "$DEST/"

      - name: Install dependencies and restart API
        env:
          PYTHON: python3
        run: bash /var/www/criclab-web-backend/deploy/restart.sh
