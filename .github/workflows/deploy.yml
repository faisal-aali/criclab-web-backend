# git pull → install → compile → pm2 restart
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lightsail-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: /var/www/criclab-web-backend
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: git pull
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/pull.sh "$APP_DIR" main

      - name: Install, lint, test, deploy
        run: bash "$APP_DIR/deploy/restart.sh"
