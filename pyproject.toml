[project]
name = "criclab-web-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pymongo>=4.10.0",
  "motor>=3.6.0",
  "opencv-contrib-python-headless==4.11.0.86",
  "numpy<2",
  "mediapipe>=0.10.14,<0.10.30",
  "matplotlib>=3.8.0",
  "cloudinary>=1.40.0",
  "reportlab>=4.2.0",
  "httpx>=0.27.0",
  "boto3>=1.35.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "pillow>=11.0.0",
  "pyjwt>=2.9.0",
  "bcrypt>=4.2.0",
  "aiosmtplib>=3.0.0",
  "email-validator>=2.2.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python vercel_opencv_headless.py"
